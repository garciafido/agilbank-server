  modes: [String!]!
  editableFields: [String!]!
  currentValues: Json
}

type SimulationControlResult {
  ok: Boolean!
}

type SimulationStartResult {
  sessionId: ID!
}

type SimulationResetResult {
  ok: Boolean!
}

type Thumbnail {
