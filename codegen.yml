overwrite: true
schema: "src/**/*.graphql"
generates:
  src/graphql/types.ts:
    plugins:
      - "typescript"
      - "typescript-resolvers"
    config:
      contextType: ../server#MyApolloContext
      useTypeImports: true
config:
  scalars:
    DateTime: string
    Date: string
    Json: any
    Decimal: number
  enumsAsConst: true
