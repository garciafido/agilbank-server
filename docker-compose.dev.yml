# Development Docker Compose
# Provides PostgreSQL (same image as production) and Redis for local dev.
# Server, worker, and client run on the host (not containerized).
#
# Postgres image is built from the production Dockerfile at
# ${INFRA_PG_DIR} (por defecto la ruta desde este server hasta
# infrastructure/postgres-service, calculada al generar; docker/dev/.env la
# puede pisar) so dev inherits any extension
# upgrade (pgmq, pgvector, pgaudit) without duplication.
# Init scripts are mounted from the same source for the same reason.
#
# Differences vs production:
#   - No pgbouncer, no SSL, no WAL archiving, no postgres-exporter
#   - No external networks (server/worker run on the host, connect via localhost)
#   - shared_preload_libraries enabled so pg_stat_statements / pgaudit
#     CREATE EXTENSION calls in the init script succeed
services:
  postgres:
    build:
      context: ${INFRA_PG_DIR:-../../infrastructure/postgres-service}
      dockerfile: Dockerfile
    image: agilbank-postgres-dev:latest
    container_name: ${COMPOSE_PROJECT_NAME:-agilbank}-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agilbank}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      # NOTE: this image (ghcr.io/pgmq/pg18-pgmq) uses PGDATA=/var/lib/postgresql/18/docker
      # We mount the parent dir so the volume captures whatever subpath the image picks.
      - postgres_data:/var/lib/postgresql
      - ${INFRA_PG_DIR:-../../infrastructure/postgres-service}/init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements,pgaudit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-agilbank}-redis-dev
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6382}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mail catcher de desarrollo: captura todo el correo saliente (activación,
  # reset de password, notificaciones) sin credenciales reales. UI en
  # http://localhost:${MAILPIT_UI_PORT:-8029}. Solo dev — prod usa SMTP real.
  # Con varios proyectos corriendo a la vez, pisar los puertos en docker/dev/.env.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ${COMPOSE_PROJECT_NAME:-agilbank}-mailpit-dev
    environment:
      MP_MAX_MESSAGES: "5000"
    ports:
      - "${MAILPIT_SMTP_PORT:-1029}:1025"
      - "${MAILPIT_UI_PORT:-8029}:8025"

volumes:
  postgres_data:
  redis_data:
